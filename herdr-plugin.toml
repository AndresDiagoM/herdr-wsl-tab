id = "wsl-tab"
name = "WSL Tab"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Open a Herdr tab or split running a WSL distro, with the HERDR_* variables passed through so agents inside WSL can drive Herdr."
platforms = ["windows"]

# Pane entrypoint: the pane's process is wsl.exe (through a tiny PowerShell launcher
# that sets WSLENV for this process only). Placement can be overridden by
# `herdr plugin pane open --placement split|tab|zoomed`.
[[panes]]
id = "shell"
title = "WSL"
placement = "tab"
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/shell.ps1"]

# After a Herdr restart, put WSL back into the panes that were WSL panes (Herdr restores
# every pane as the default shell). Also available as the `restore` action.
[[startup]]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/restore.ps1", "-Quiet"]

[[actions]]
id = "restore"
title = "WSL: restore WSL in panes Herdr brought back as pwsh"
contexts = ["workspace", "tab", "pane"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/restore.ps1"]

# Open a WSL tab in the current workspace (bind this to a key).
[[actions]]
id = "open"
title = "WSL: open tab"
contexts = ["workspace", "tab", "pane"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/open.ps1", "tab"]

# Open a WSL split next to the current pane.
[[actions]]
id = "open-split"
title = "WSL: open split"
contexts = ["workspace", "tab", "pane"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/open.ps1", "split"]

# Install the Linux-side pieces in the distro: ~/.local/bin/herdr wrapper and the Claude Code
# hooks that report the session's state to Herdr (idempotent, keeps a settings.json backup).
[[actions]]
id = "setup"
title = "WSL: install herdr wrapper + Claude hooks in the distro"
contexts = ["workspace", "tab", "pane"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/setup.ps1"]

# Print distros, config, WSLENV and whether herdr is reachable from inside WSL.
[[actions]]
id = "doctor"
title = "WSL: doctor"
contexts = ["workspace", "tab", "pane"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/doctor.ps1"]
